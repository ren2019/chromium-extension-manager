[package]
name = "cepm-app"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
cepm-core = { path = "../cepm-core" }
gpui-kit = "=0.8.1"
rfd = "0.15"
directories = "6"

chrono = "0.4"

[features]
