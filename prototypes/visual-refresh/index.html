s="path-text">${fullPath}</dd><dt>扩展 ID</dt><dd class="path-text">${x.extensionId||'首次加载后记录'}</dd></dl></section><section class="card info-card wide"><h3>最近操作</h3>${entries.length?entries.slice(0,3).map(l=>`<div class="detail-log"><span>${esc(l.text)}</span><time>${l.at||'刚刚'}</time></div>`).join(''):`<div class="detail-log"><span>${x.updatedAt?'扩展文件已更新至 '+x.version:'首次安装文件已准备'}</span><time>${x.updatedAt||x.installedAt}</time></div>`}</section></div></div>`;}
function resetScene(s=scene){checkGeneration++;selectedRecord=null;scene=s;items=seed();logs=[];view='library';menu=false;modal=null;busy=false;lastCheck='';notice='';if(scene!=='daily'){targetId='chrome-personal';savePreferences()}
if(scene==='empty')items=items.filter(x=>x.targetId!==targetId);
if(scene==='pending'){items[0].version='1.0.27';items[0].state='pending';items[0].first=false;items[0].backup='1.0.26';items[2].state='pending';items[2].effective=null;items[2].first=true;}
if(scene==='error'){notice='无法检查 OpenCLI 的更新';items[0].checkFailed=true;items[0].checkedAt='2026-10-30 09:30';}
if(scene==='updates'){items[0].latest='1.0.27';items[0].checkedAt='2026-10-30 09:30';lastCheck='刚刚检查 · 1 个扩展有新版本';}
if(scene==='conflict')items[2].state='conflict';
const u=new URL(location);u.searchParams.set('scene',scene);history.replaceState({},'',u);render();}
function profileMenu(){const row=p=>`<div class="profile-row ${p.id===targetId?'selected':''}"><button class="profile-choice" data-action="switch" data-id="${p.id}">${browserLogo(p.browser)}<span class="grow context-title">${p.browser} <span style="font-weight:400">· ${p.name}</span></span><span class="profile-total" title="本应用管理的扩展" aria-label="${items.filter(x=>x.targetId===p.id).length} 个受管扩展">${items.filter(x=>x.targetId===p.id).length}</span><span class="profile-check">${p.id===targetId?icon('check'):''}</span></button><button class="ghost icon-btn pin ${pinnedIds.includes(p.id)?'pinned':''}" data-action="pin" data-id="${p.id}" title="${pinnedIds.includes(p.id)?'取消置顶':'置顶'} ${p.browser} · ${p.name}" aria-label="${pinnedIds.includes(p.id)?'取消置顶':'置顶'} ${p.browser} · ${p.name}">${icon('pin')}</button></div>`;
const ordered=[...pinnedIds.map(id=>profiles.find(p=>p.id===id)),...profiles.filter(p=>!pinnedIds.includes(p.id))];return `<div class="profile-menu" role="region" aria-label="浏览器与配置">${ordered.map(row).join('')}<div class="menu-divider"></div>${btn('bind','添加浏览器配置','plus','ghost','style="width:100%;justify-content:flex-start"')}</div>`;}
function sidebar(){return `<aside class="sidebar"><div class="context"><button data-action="context" class="context-toggle" aria-expanded="${menu}" aria-label="切换浏览器与配置">${browserLogo(target().browser)}<span class="grow"><span class="context-title">${target().browser}</span><span class="context-sub" style="display:block">${target().name}</span></span>${icon('chevrons-up-down')}</button>${menu?profileMenu():''}</div><div><p class="nav-label">工作区</p>${[['library','我的扩展','puzzle',scoped().length],['attention','待处理','circle-dot',pending().length],['history','操作记录','history','']].map(([key,label,ic,count])=>`<button class="nav ${view===key?'active':''}" data-action="nav" data-view="${key}">${icon(ic)}${label}<span class="nav-count">${count||''}</span></button>`).join('')}</div><div class="sidebar-bottom">${btn('native','浏览器扩展管理','external-link','ghost native',scene==='missing'?'disabled':'')}${btn('nav','关于','info',view==='about'?'native active':'ghost native','data-view="about"')}</div></aside>`;}
function statusLine(x){if(x.loadFailed)return `<span class="status red">${icon('circle-alert')}更新失败</span>`;if(x.state==='pending')return `<span class="status amber">${icon('clock-3')}${x.first?'等待首次加载':'等待重载确认'}</span>`;if(x.state==='conflict')return `<span class="status amber">${icon('triangle-alert')}发现本地修改</span>`;if(x.state==='error')return `<span class="status red">${icon('circle-alert')}更新失败</span>`;return `<span>${esc(x.effective||x.version)}</span><span class="meta-dot"></span><span>已安装</span>`;}
function row(x){const result=checkResult(x);return `<div class="extension" role="button" tabindex="0" data-action="detail" data-id="${x.id}" aria-label="查看 ${esc(x.name)} 详情，${x.version}，${x.state==='pending'?'等待浏览器核对':x.state==='ok'?'已安装':'需要处理'}，${result}">${extIcon(x)}<div class="grow"><div class="ext-heading"><span class="ext-name ellipsis" title="${esc(x.name)}">${esc(x.name)}</span>${hasUpdate(x)?`<span class="update-badge">${icon('arrow-right')}新版本 ${x.latest}</span>`:''}</div><div class="ext-meta">${statusLine(x)}${x.checkedAt&&!hasUpdate(x)&&!x.checkFailed&&x.state==='ok'?'<span class="meta-dot"></span><span>没有新版本</span>':x.checkFailed?'<span class="meta-dot"></span><span class="red-text">检查失败</span>':''}</div><div class="row-dates"><span title="${x.installedAt||'未记录'}">安装于 ${shortDate(x.installedAt)}</span><span class="meta-dot"></span><span title="${x.updatedAt||'尚未发生文件更新'}">${x.updatedAt?'更新于 '+shortDate(x.updatedAt):'尚未更新'}</span></div></div><div class="row-trail">${x.state==='pending'?btn('guide',x.first?'继续加载':'继续确认','','',`data-id="${x.id}"`):['error','conflict'].includes(x.state)?btn('detail','查看问题','','',`data-id="${x.id}"`):hasUpdate(x)?btn('upgrade','更新','','',`data-id="${x.id}" ${busy?'disabled':''}`):''}<span class="chev">${icon('chevron-right')}</span></div></div>`;}
function aboutPage(){return `<header class="pagehead"><h1>关于</h1></header><section class="card about-hero">${appLogo()}<div><h2>${appName}</h2><p class="subtitle">非商店 Chromium 扩展的安装与更新管理器</p><p class="subtitle">版本 0.1.0 · 视觉样稿</p></div></section><section class="card about-info"><dl class="definition"><dt>项目</dt><dd>ren2019/chromium-extension-manager</dd><dt>支持来源</dt><dd>GitHub Release、仓库目录与本地文件夹</dd><dt>管理范围</dt><dd>按浏览器与 Profile 分开管理通过本应用添加的扩展</dd></dl><div class="about-links"><a href="https://github.com/ren2019/chromium-extension-manager" target="_blank" rel="noopener noreferrer">项目主页 ${icon('external-link')}</a><a href="https://github.com/ren2019/chromium-extension-manager/issues" target="_blank" rel="noopener noreferrer">反馈问题 ${icon('external-link')}</a></div></section>`;}
function library(){if(view==='about')return aboutPage();if(selectedRecord){const x=byId(selectedRecord);if(x?.targetId===targetId)return detailPage(x);}const title={library:'我的扩展',attention:'待处理',history:'操作记录'}[view];const header=`<header class="pagehead"><div><h1>${title}</h1><p class="subtitle">${view==='attention'?'完成浏览器中的最后一步':view==='history'?'当前配置的安装与维护记录':targetLabel()}</p></div>${view==='library'?`<div class="toolbar">${btn('check',busy?'检查中':'检查更新',busy?'loader-circle':'refresh-cw',busy?'ghost busy':'ghost',busy||!scoped().length||scene==='missing'?'disabled':'')}${scoped().length?btn('add','添加扩展','plus','primary',scene==='missing'?'disabled':''):''}</div>`:''}</header>`;
if(scene==='missing')return header+`<div class="card empty"><div class="empty-icon">${icon('folder-search')}</div><h2>找不到这个浏览器配置</h2><p>${targetLabel()} 的安装记录仍然保留。<br>重新定位后即可继续管理。</p>${btn('locate','重新定位','folder-search','primary')}</div>`;
if(view==='history'){const entries=logs.filter(x=>x.targetId===targetId);return header+`<div class="card">${entries.length?entries.map(x=>`<div class="history-entry">${icon('check')}<div class="grow"><h3>${esc(x.text)}</h3><p class="subtitle">刚刚 · ${targetLabel()}</p></div></div>`).join(''):`<div class="empty"><div class="empty-icon">${icon('history')}</div><h2>还没有操作记录</h2><p>此配置的安装和更新操作会显示在这里。</p></div>`}</div>`;}
let list=view==='attention'?pending():scoped();let banner=notice?`<div class="banner">${icon('circle-alert')}<div class="grow"><strong>${notice}</strong><p>来源暂时不可用，已安装的版本不受影响。</p></div>${btn('retry-check','重试','','ghost')}</div>`:'';
if(!list.length)return header+banner+`<div class="card">${view==='attention'?`<div class="all-clear">${icon('circle-check')}<h2>都处理好了</h2><p class="subtitle">这个配置没有需要你继续的操作。</p></div>`:`<div class="empty"><div class="empty-icon">${icon('puzzle')}</div><h2>添加你的第一个扩展</h2><p>从 GitHub 或本地文件夹添加，<br>以后在这里统一维护。</p>${btn('add','添加扩展','plus','primary')}</div>`}</div>`;
return header+banner+`<section class="card" aria-label="扩展列表"><div class="card-label"><span>${view==='attention'?'需要你继续':'已添加的扩展'}</span><span>${list.length} 个</span></div>${list.map(row).join('')}</section><div class="list-foot"><span>${lastCheck||'仅显示此配置中的扩展'}</span>${view==='library'?`<span>${pending().length?pending().length+' 个待处理':updateCount()?updateCount()+' 个可更新':'所有扩展已完成加载'}</span>`:''}</div>`;}
function render(){const toastNode=$('.toast');const toastHTML=toastNode?.outerHTML||'';$('#app').innerHTML=`<div class="titlebar"><span class="traffic"></span><span class="traffic"></span><span class="traffic"></span><span class="window-title">${appLogo()}${appName}</span></div><div class="body">${sidebar()}<main class="main">${library()}</main></div><div id="modal-root"></div>${toastHTML}`;if(modal)drawModal();renderDock();renderState();}
function renderDock(){$('#dock').innerHTML=`<div class="demo-dock"><span class="demo-tag">交互样稿 · 不执行真实操作</span><span class="dock-divider"></span><label for="scene">场景</label><select id="scene">${[['daily','日常使用'],['updates','发现新版本'],['empty','空列表'],['pending','等待加载 / 重载'],['error','检查更新失败'],['conflict','本地修改冲突'],['missing','配置不可用']].map(([k,t])=>`<option value="${k}" ${scene===k?'selected':''}>${t}</option>`).join('')}</select>${iconBtn('reset','重置当前场景','rotate-ccw')}<span class="dock-divider"></span>${btn('demo-state','查看演示状态','','ghost')}</div>`;}
function renderState(){$('#state').innerHTML=showState?`<pre class="state-pop">${esc(JSON.stringify({scene,profile:targetLabel(),pinned:pinnedIds,view,detail:selectedRecord,dialog:modal?.kind||null,step:modal?.step||null,installations:scoped().map(x=>({name:x.name,files:x.version,effective:x.effective,state:x.state,loadFailed:!!x.loadFailed,latest:x.latest,installedAt:x.installedAt,updatedAt:x.updatedAt,checkedAt:x.checkedAt}))},null,2))}</pre>`:'';}
function openModal(kind,id,extra={}){if(kind==='detail')return showDetail(id);opener={action:document.activeElement?.dataset.action,id:document.activeElement?.dataset.id,view:document.activeElement?.dataset.view};menu=false;modal={kind,id,step:1,...extra};render();requestAnimationFrame(()=>$('.modal [data-action="close"]')?.focus());}

function frame(title,body,foot,subtitle=targetLabel()){const restoreFocus=document.activeElement?.id;$('#modal-root').innerHTML=`<div class="overlay ${modal?.kind==='guide'?'guide-overlay':''}"><section class="modal" role="dialog" aria-modal="${modal?.kind==='guide'?'false':'true'}" aria-labelledby="modal-title"><header class="modal-head"><div><h2 id="modal-title">${title}</h2><p class="subtitle">${subtitle}</p></div>${iconBtn('close','关闭','x')}</header><div class="modal-body">${body}<div id="modal-error" class="error-text" role="alert"></div></div>${foot?`<footer class="modal-foot">${foot}</footer>`:''}</section></div>`;const restored=restoreFocus?document.getElementById(restoreFocus):null;(restored||$('.modal [data-action="close"]'))?.focus();renderState();}
function steps(labels,n){return `<div class="steps">${labels.map((s,i)=>`${i?'<span class="step-line"></span>':''}<div class="step ${i+1===n?'on':i+1<n?'done':''}"><span>${i+1<n?icon('check'):i+1}</span>${s}</div>`).join('')}</div>`;}
function preview(x){return `<div class="preview">${extIcon(x)}<div class="grow"><h3>${esc(x.name)}</h3><p class="subtitle">${x.version} · 浏览器扩展</p></div></div>`;}
function guideArt(){return `<div class="guide-illustration">${browserLogo(target().browser)}${icon('arrow-right')}<div class="mini-page" aria-hidden="true"><div class="mini-title"></div><div class="mini-row">${icon('puzzle')}扩展程序<span class="spacer"></span>${icon('check')}</div></div></div>`;}
function drawAdd(){const m=modal;const source=m.source||'release';let body=steps(['选择来源','确认安装'],m.step);if(m.step===1){body+=`<div class="segmented">${[['release','GitHub Release','github'],['repo','仓库目录','git-branch'],['local','本地文件夹','folder']].map(([k,t,i])=>btn('source',t,i,k===source?'active':'',`data-source="${k}"`)).join('')}</div>`;
if(source==='local')body+=`<label class="field">扩展文件夹</label>${btn('folder',m.folder?'my-extension':'选择文件夹','folder','',`style="width:100%;justify-content:flex-start;margin:-8px 0 16px"`)}<p class="helptext" style="margin-bottom:18px">选择包含 manifest.json 的完整扩展文件夹。</p>`;
else body+=`<label class="field">GitHub 仓库${source==='release'?'或 Release 地址':''}<input id="source-url" value="${esc(m.url||'https://github.com/jackwener/OpenCLI')}" placeholder="https://github.com/owner/repository"></label>${source==='repo'?`<div class="flex"><label class="field grow">分支、标签或提交<input id="source-ref" value="main"></label><label class="field grow">扩展子目录<input id="source-dir" value="extension"></label></div>`:''}`;
body+=`<div class="callout">${icon(source==='local'?'folder-check':'lock-keyhole')}<span>${source==='local'?'安装后会保存独立副本，原文件夹不会被修改。':'沿用此电脑的 GitHub 授权，可读取你有权访问的私有仓库。'}</span></div>`;

}else{const x={name:source==='release'?'OpenCLI':'我的扩展',version:m.version||'1.0.26',icon:source==='release'?'opencli':null};body+=preview(x)+`<dl class="definition"><dt>安装到</dt><dd>${targetLabel()}</dd><dt>来源</dt><dd class="ellipsis" title="${esc(m.url||'本地目录 · my-extension')}">${esc(source==='local'?'本地目录 · my-extension':m.url||'jackwener/OpenCLI')}</dd><dt>扩展版本</dt><dd><div class="flex between"><span>${x.version} <span class="muted small">${x.version==='1.0.26'?'· 最新正式版':''}</span></span>${source==='release'?btn('toggle-versions',m.showVersions?'收起':'选择版本','','link'):''}</div></dd></dl>`;
if(m.showVersions)body+=`<div class="versions">${['1.0.26','1.0.25','1.0.24'].map(v=>`<label><input name="version" type="radio" value="${v}" ${x.version===v?'checked':''}>${v}<span class="muted">${v==='1.0.26'?'最新正式版':'历史版本'}</span></label>`).join('')}</div>`;
body+=`<div class="divider"></div><div class="callout">${icon('info')}<span>文件准备好后，我们会带你到 ${target().browser} 完成首次加载。</span></div>`;
frame('添加扩展',body,`${btn('add-back','上一步','arrow-left','ghost')}${btn('install','安装','','primary')}`);}}
function drawGuide(x){if(!x.first){frame('确认更新结果',preview(x)+`<p class="guide-copy confirm-summary">请从左侧「浏览器扩展管理」进入 ${targetLabel()}，重新加载扩展，确认显示上方版本后完成更新。</p>`,`${btn('update-failed','更新失败','','danger')}${btn('confirm','确认更新完成','check','primary')}`);return;}
const n=modal.step;let body=steps(['加载扩展','确认完成'],n);let primary='';if(n===1){body+=`<h3>加载已解压的扩展</h3><p class="guide-copy">从左侧「浏览器扩展管理」进入 ${targetLabel()}，开启「开发者模式」，点击「加载已解压的扩展程序」，选择下方文件夹。</p><div class="code-path"><code>CEPM / installations / ${x.id}</code>${btn('copy-path','复制位置','copy')}</div>`;primary=btn('guide-next','已加载，下一步','arrow-right','primary');}else{body+=`<h3>${esc(x.name)} 显示的是这个版本吗？</h3><div class="version-check"><small>请核对浏览器扩展卡片</small><strong>${x.version}</strong></div><label class="field">扩展 ID<input id="extension-id" placeholder="复制扩展卡片上的 32 位 ID" autocomplete="off"></label>`;primary=btn('confirm','确认安装完成','check','primary');}frame('完成首次加载',body,`${n===1?btn('close','稍后继续','','ghost'):btn('guide-back','上一步','arrow-left','ghost')}${primary}`);}

if(m.kind==='versions'){frame('选择其他版本',preview(x)+`<p class="helptext">${x.type==='local'?'本地历史版本需要提供对应的文件夹。':'版本以扩展清单为准，可能与仓库 Release 标签不同。'}</p>${x.type==='local'?`<div class="guide-action">${btn('version-folder','选择其他版本文件夹','folder')}</div>`:`<div class="versions">${[x.version,'1.0.25','1.0.24'].filter((v,i,a)=>a.indexOf(v)===i).map((v,i)=>`<label><input type="radio" name="other-version" value="${v}" ${i===0?'checked':''}>${v}${i===0?' · 当前文件版本':''}</label>`).join('')}</div>`}`,`${btn('detail','返回','arrow-left','ghost',`data-id="${x.id}"`)}${btn('version-preview','预览变更','','primary',`data-id="${x.id}" ${x.type==='local'&&!m.folder?'disabled':''}`)}`);return;}
if(m.kind==='update'){let v=m.version||'1.0.27',same=v===x.version;frame(same?'重新部署此版本':'确认版本变更',preview(x)+`<dl class="definition"><dt>当前文件</dt><dd>${x.version}</dd><dt>将要安装</dt><dd>${v}</dd></dl><div class="callout amber" style="margin-top:20px">${icon('triangle-alert')}<span>${same?'这会重新部署同版本文件。':'安装旧版本属于降级，可能与已有扩展数据不兼容。'}操作前会备份当前文件。</span></div><label class="check-label"><input type="checkbox" id="version-consent">我确认执行本次${same?'重新部署':'版本变更'}。</label>`,`${btn('close','取消','','ghost')}${btn('deploy','确认部署','','primary',`data-id="${x.id}"`)}`);return;}
if(m.kind==='restore'){frame('恢复更新前的文件',preview(x)+`<p class="guide-copy">恢复至 ${x.backup||x.effective||x.version}。恢复后仍需回到浏览器重载并核对。</p><div class="callout amber" style="margin-top:17px">${icon('info')}<span>仅恢复扩展文件，不能撤销新版已写入的数据。</span></div><label class="check-label"><input type="checkbox" id="restore-consent">我已尝试重载，确认新版无法加载。</label>`,`${btn('close','取消','','ghost')}${btn('restore-confirm','恢复文件','','danger',`data-id="${x.id}"`)}`);return;}
if(m.kind==='bind'||m.kind==='locate'){frame(m.kind==='locate'?'重新定位配置':'添加浏览器配置',`<p class="guide-copy" style="margin-top:0">选择需要维护的浏览器配置。</p><div style="margin:18px 0">${profiles.map(p=>`<button data-action="bind-select" data-id="${p.id}" style="width:100%;justify-content:flex-start;margin:3px 0;padding:10px;height:46px">${browserLogo(p.browser)}${p.browser} · ${p.name}<span class="spacer"></span>${icon('chevron-right')}</button>`).join('')}</div><div class="callout">${icon('info')}<span>样稿使用演示配置，不读取此电脑的浏览器数据。</span></div>`,btn('close','取消','','ghost'));return;}}
let toastTimer;function toast(t){clearTimeout(toastTimer);$('.toast')?.remove();$('#app').insertAdjacentHTML('beforeend',`<div class="toast" role="status">${icon('info')}${esc(t)}</div>`);toastTimer=setTimeout(()=>$('.toast')?.remove(),4200);}
function fail(t){$('#modal-error').textContent=t;}
function log(text,recordId=null){logs.unshift({targetId,text,recordId,at:nowText()});}
function checkUpdates(retry=false,id=null){if(busy)return;const context=targetId,list=id?[byId(id)]:scoped().slice();const generation=++checkGeneration;busy=true;notice='';render();setTimeout(()=>{if(generation!==checkGeneration)return;for(const x of list){if(!x)continue;x.checkedAt=nowText();x.checkFailed=false;x.latest=x.mockLatest||x.version;}busy=false;const count=list.filter(x=>x&&hasUpdate(x)).length;if(context===targetId)lastCheck='刚刚检查 · '+(count?count+' 个扩展有新版本':'没有新版本');render();if(context===targetId){toast((retry?'演示：连接恢复，':'')+(count?'发现 '+count+' 个可更新扩展':'没有发现新版本'));}},650);}
function deploy(x,v){x.backup=x.version;x.version=v;x.state='pending';x.first=false;x.loadFailed=false;x.updatedAt=nowText();log(x.name+' 文件已更新至 '+v+'，等待浏览器核对',x.id);openModal('guide',x.id);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b){if(menu&&!e.target.closest('.profile-menu')){menu=false;render()}return;}if(b.disabled)return;const a=b.dataset.action,id=b.dataset.id,x=byId(id);switch(a){
case 'context':modal=null;menu=!menu;render();$('[data-action="context"]')?.focus();break;
case 'pin':pinnedIds=pinnedIds.includes(id)?pinnedIds.filter(p=>p!==id):[...pinnedIds,id];savePreferences();render();$(`[data-action="pin"][data-id="${id}"]`)?.focus();break;
case 'switch':modal=null;selectedRecord=null;targetId=id;savePreferences();menu=false;view='library';notice='';lastCheck='';render();$('[data-action="context"]')?.focus();break;
case 'nav':modal=null;selectedRecord=null;view=b.dataset.view;menu=false;render();break;
case 'reset':resetScene();toast('已重置演示数据，置顶与上次选择保留');break;
case 'demo-state':showState=!showState;renderState();break;
case 'add':openModal('add',null,{source:'release'});break;
case 'source':modal.url=$('#source-url')?.value;modal.source=b.dataset.source;drawModal();break;
case 'folder':modal.folder=true;drawModal();toast('已选择演示文件夹');break;
case 'add-next':if(modal.source==='local'&&!modal.folder)return fail('请先选择一个文件夹。');if(modal.source!=='local'){modal.url=$('#source-url').value.trim();if(!modal.url)return fail('请填写来源地址。');if(modal.source==='repo'&&!$('#source-dir').value.trim())return fail('请填写扩展子目录。');}modal.step=2;drawModal();break;
case 'add-back':modal.step=1;drawModal();break;
case 'toggle-versions':modal.showVersions=!modal.showVersions;drawModal();break;
case 'install':{const m=modal;const next={id:Date.now(),targetId,name:m.source==='release'?'OpenCLI':'我的扩展',icon:m.source==='release'?'opencli':null,type:m.source,source:m.source==='local'?'本地目录 · my-extension':m.url,version:m.version||'1.0.26',effective:null,state:'pending',first:true,installedAt:nowText(),updatedAt:null,checkedAt:null,latest:null};items.push(next);log(next.name+' 文件已准备，等待首次加载',next.id);openModal('guide',next.id);break;}
case 'guide':openModal('guide',id);break;
case 'guide-next':modal.step++;drawModal();break;
case 'guide-back':modal.step--;drawModal();break;

case 'confirm':{const record=byId(modal.id);if(record.first){const value=$('#extension-id').value.trim();if(!/^[a-p]{32}$/.test(value))return fail('请输入 32 位 a–p 小写字母组成的扩展 ID。演示可使用 32 个 a。');record.extensionId=value;}record.effective=record.version;record.first=false;record.state='ok';record.loadFailed=false;log(record.name+' '+record.version+' · 用户已确认',record.id);closeModal();render();toast('已记录你的版本确认');break;}
case 'update-failed':{const record=byId(modal.id);record.loadFailed=true;log(record.name+' · 用户反馈更新失败，等待处理',record.id);showDetail(record.id);toast('已记录更新失败，可重新核对或恢复旧文件');break;}
case 'detail':showDetail(id);break;
case 'back-library':{const previous=selectedRecord;selectedRecord=null;render();$(`[data-action="detail"][data-id="${previous}"]`)?.focus();break;}
case 'upgrade':if(x&&hasUpdate(x)&&x.state==='ok'&&!busy)deploy(x,x.latest);break;
case 'check':checkUpdates();break;
case 'retry-check':checkUpdates(true);break;
case 'detail-check':checkUpdates(false,id);break;
case 'native':toast('样稿演示：已请求打开 '+targetLabel()+' 的扩展管理页');break;

case 'copy-url':navigator.clipboard?.writeText((target().browser==='Chrome'?'chrome':'edge')+'://extensions').then(()=>toast('已复制管理页地址')).catch(()=>toast('请手动复制上方地址'));break;
case 'copy-path':toast('样稿演示：正式应用会复制完整安装目录');break;
case 'show-folder':toast('样稿演示：正式应用会打开固定安装目录');break;
case 'versions':openModal('versions',id);break;
case 'version-folder':modal.folder=true;drawModal();toast('已选择演示历史版本文件夹');break;
case 'version-preview':openModal('update',id,{version:$('input[name="other-version"]:checked')?.value||'0.8.0'});break;
case 'deploy':if(!$('#version-consent').checked)return fail('请先确认这次版本变更。');deploy(x,modal.version);break;
case 'restore':openModal('restore',id);break;
case 'restore-confirm':if(!$('#restore-consent').checked)return fail('只有明确加载失败后才执行恢复。');x.version=x.backup||x.effective||x.version;x.backup=null;x.state='pending';x.first=false;x.loadFailed=false;x.updatedAt=nowText();log(x.name+' 已恢复旧文件，等待核对',x.id);openModal('guide',x.id);break;
case 'bind':openModal('bind');break;
case 'locate':openModal('locate');break;
case 'bind-select':selectedRecord=null;targetId=id;savePreferences();if(scene==='missing')scene='daily';closeModal();render();toast('已选择演示配置');break;
case 'close':closeModal();break;
}});
document.addEventListener('change',e=>{if(e.target.id==='scene')resetScene(e.target.value);if(e.target.name==='version'){modal.version=e.target.value;drawModal();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modal)closeModal();else if(menu){menu=false;render();$('[data-action="context"]')?.focus()}else if(showState){showState=false;renderState()}return;}
if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"]')){e.preventDefault();e.target.click()}
if(e.key==='Tab'&&((modal&&modal.kind!=='guide')||menu)){const scope=modal?$('.modal'):$('.context');const nodes=[...scope.querySelectorAll('button:not(:disabled),input,select,summary,[tabindex="0"]')].filter(n=>n.getClientRects().length);const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
});
resetScene();
</script>
</body>
</html>
