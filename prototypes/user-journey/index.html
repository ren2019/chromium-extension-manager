<body><div id="app"></div><div id="layer"></div><div id="toast"></div><div id="switcher"></div>
<script>
// THROWAWAY PROTOTYPE. Three structural variants of the complete CEPM user journey.
// Question: can users discover the next step from adding a source through daily updates and recovery?
// All sources, versions, browser observations and operations below are simulated; no external mutations.
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed=()=>[
{id:1,name:'OpenCLI Browser Bridge',desc:'让 OpenCLI 与浏览器连接',symbol:'O_',color:'',type:'release',source:'jackwener/OpenCLI',version:'1.2.0',latest:'1.3.0',effective:'1.2.0',state:'update',browser:'Chrome',profile:'个人',tag:'v0.8.0',history:['用户确认 1.2.0 已在 Chrome 生效','从 GitHub Release 安装']},
{id:2,name:'阅读助手',desc:'专注阅读与页面整理',symbol:'R',color:'purple',type:'repo',source:'sample/reading-helper · main / extension',version:'2.1.0',latest:'2.1.0',effective:'2.1.0',state:'ok',browser:'Chrome',profile:'工作',history:['用户确认 2.1.0 已生效']},
{id:3,name:'标签整理',desc:'按主题整理浏览器标签',symbol:'T',color:'orange',type:'local',source:'本地目录 · tab-organizer',version:'1.4.0',latest:'1.4.0',effective:null,state:'pending',browser:'Chrome',profile:'个人',first:true,history:['文件已安装，等待首次加载']},
{id:4,name:'页面笔记',desc:'将想法留在页面旁边',symbol:'N',color:'blue',type:'local',source:'本地目录 · page-notes',version:'0.9.0',latest:'1.0.0',effective:'0.9.0',state:'conflict',browser:'Chrome',profile:'工作',history:['发现安装目录中有手动修改，已暂停更新']},
{id:5,name:'OpenCLI Browser Bridge',desc:'让 OpenCLI 与浏览器连接',symbol:'O_',color:'',type:'release',source:'jackwener/OpenCLI',version:'1.1.0',latest:'1.3.0',effective:'1.1.0',state:'update',browser:'Chrome',profile:'工作',history:['用户确认工作配置中的 1.1.0 已生效']},
{id:6,name:'阅读助手',desc:'专注阅读与页面整理',symbol:'R',color:'purple',type:'repo',source:'sample/reading-helper · main / extension',version:'2.0.0',latest:'2.1.0',effective:'2.0.0',state:'update',browser:'Edge',profile:'个人',history:['用户确认 Edge 个人配置中的 2.0.0 已生效']}
];
const profiles=[
{id:'chrome-personal',browser:'Chrome',name:'个人',directory:'Default',dataRoot:'~/Library/Application Support/Google/Chrome',app:'/Applications/Google Chrome.app',initial:'个'},
{id:'chrome-work',browser:'Chrome',name:'工作',directory:'Profile 1',dataRoot:'~/Library/Application Support/Google/Chrome',app:'/Applications/Google Chrome.app',initial:'工'},
{id:'edge-personal',browser:'Edge',name:'个人',directory:'Default',dataRoot:'~/Library/Application Support/Microsoft Edge',app:'/Applications/Microsoft Edge.app',initial:'个'},
{id:'edge-test',browser:'Edge',name:'测试',directory:'Profile 2',dataRoot:'~/Library/Application Support/Microsoft Edge',app:'/Applications/Microsoft Edge.app',initial:'测'}
];
const seedTargets=()=>seed().map(x=>({...x,targetId:profiles.find(p=>p.browser===x.browser&&p.name===x.profile).id}));
let targetId='chrome-personal',checkedTargets={};
let items=seedTargets(),variant=new URLSearchParams(location.search).get('variant')||'A',filter='all',query='',selected=1,view='library',modal=null,scene='daily',logs=[],checkedAt='还未检查',busy=false;
if(!['A','B','C'].includes(variant))variant='A';
const names={A:'扩展库',B:'待办首页',C:'紧凑列表'};
const status={ok:'已确认生效',update:'可更新',pending:'需要你完成',conflict:'更新已暂停',error:'获取失败',same:'同版本内容变化'};
const icon=x=>`<div class="icon ${x.color}">${x.symbol}</div>`;
const badge=x=>`<span class="badge ${x.state}"><span class="dot"></span>${status[x.state]}</span>`;
const byId=id=>items.find(x=>x.id===Number(id));
const target=()=>profiles.find(p=>p.id===targetId);
const scoped=()=>items.filter(x=>x.targetId===targetId);
const targetFor=x=>profiles.find(p=>p.id===x.targetId);
const logEntry=(x,text)=>logs.unshift({targetId:x.targetId,text});
const pending=()=>scoped().filter(x=>['pending','conflict','error','same'].includes(x.state));
const upgrades=()=>scoped().filter(x=>x.state==='update');
const action=x=>x.state==='same'?`<button class="small" data-action="update" data-id="${x.id}">查看变化</button>`:x.state==='update'?`<button class="small" data-action="update" data-id="${x.id}">更新至 ${x.latest}</button>`:x.state==='pending'?`<button class="small primary" data-action="guide" data-id="${x.id}">${x.first?'完成加载':'重载并核对'}</button>`:x.state==='conflict'||x.state==='error'?`<button class="small" data-action="detail" data-id="${x.id}">查看原因</button>`:`<button class="small quiet" data-action="detail" data-id="${x.id}">查看详情 →</button>`;
function topbar(){return `<div class="windowbar"><span class="traffic"></span><span class="traffic"></span><span class="traffic"></span><span class="windowtitle">CEPM — 扩展管理</span></div>`}
function brand(){return `<div class="brand"><span class="brandmark">↗</span> CEPM</div>`}
function targetStrip(){const t=target();return `<div class="contextbar"><div class="browserline"><span class="contextcaption">浏览器</span>${['Chrome','Edge'].map(b=>`<button class="browserchoice ${t.browser===b?'active':''}" data-action="browser-switch" data-value="${b}" ${busy?'disabled':''}><span class="browsermark ${b==='Edge'?'edge':''}"></span>${b}</button>`).join('')}<span class="contexthelp">先选择浏览器和配置，再管理其中的扩展</span></div><div class="profileline"><span class="contextcaption">配置</span>${profiles.filter(p=>p.browser===t.browser).map(p=>`<button class="profilechoice ${p.id===targetId?'active':''}" data-action="profile-switch" data-value="${p.id}" ${busy?'disabled':''}><span class="avatar">${p.initial}</span>${p.name}${p.missing?' · 找不到':''}</button>`).join('')}<button class="quiet small" style="margin-left:auto" data-action="target-info">配置位置与识别 ↗</button></div></div>`;}
function switchTarget(id){targetId=id;selected=scoped()[0]?.id;filter='all';query='';view='library';checkedAt=checkedTargets[id]||'还未检查';closeModal();render();}
function targetInfo(){const t=target();frame(t.browser+' · '+t.name,`<div class="targetcard"><div class="flex"><span class="avatar">${t.initial}</span><h3>${t.browser} · ${t.name}</h3><span class="badge ${t.missing?'error':''}">${t.missing?'找不到配置':'示例配置'}</span></div><p class="subtitle">显示名称便于识别，实际绑定的是这台电脑上的具体配置目录。</p></div><div class="kv"><span>浏览器应用</span><span class="targetpath">${t.app}</span><span>用户数据目录</span><span class="targetpath">${t.dataRoot}</span><span>Profile 目录</span><span class="targetpath">${t.directory}</span></div><div class="notice" style="margin-top:22px">首次绑定时，在这个浏览器配置中打开 <strong>${t.browser==='Chrome'?'chrome':'edge'}://version</strong>，核对 Profile Path。目录不一致时先重新定位，不把相同显示名称当成同一个配置。</div><div class="notice" style="margin-top:12px">原型中的配置都是示例，没有扫描本机。正式方案拟读取配置名称和位置，找不到时允许手动定位；不读取浏览历史或登录信息。</div>`,`<button class="quiet" data-action="target-locate">手动定位配置…</button><button class="primary" data-action="close">完成</button>`);}
function missingTarget(){return `<div class="contextempty card"><h2>找不到 ${target().browser} · ${target().name}</h2><p class="subtitle">配置可能被移动或删除。现有安装记录与文件仍保留；重新定位前暂停维护，不会改用其他配置。</p><div class="rule"></div><p class="targetpath">${target().dataRoot}/${target().directory}</p><button style="margin-top:20px" data-action="target-info">检查配置位置</button></div>`;}
function controls(){return `<div class="toolbar"><button data-action="check" ${busy?'disabled':''}>${busy?'正在检查…':'检查更新'}</button><button class="primary" data-action="add">＋ 添加扩展</button></div>`}
function empty(){return `<div class="empty"><div class="icon">＋</div><h2>为 ${target().browser} · ${target().name} 添加第一个扩展</h2><p>粘贴 GitHub 地址，或选择本地扩展文件夹。<br>我们帮你保管文件，之后在这里检查和更新。</p><button class="primary" data-action="add">添加第一个扩展</button><div class="sources">支持 GitHub Release · 仓库子目录 · 本地文件夹</div></div>`}
function row(x){return `<div class="extension">${icon(x)}<div class="name"><button data-action="detail" data-id="${x.id}">${esc(x.name)}</button><div class="source">${esc(x.source)} · ${x.browser} / ${esc(x.profile)}</div></div><div class="version">${x.version}${x.state==='update'?` <span class="muted">→</span> ${x.latest}`:''}<small>${x.state==='pending'?'文件已准备，浏览器待核对':x.effective?'浏览器 '+x.effective:'尚未确认生效'}</small></div>${badge(x)}<div class="actions">${action(x)}</div></div>`}
function collection(){const list=scoped().filter(x=>(filter==='all'||filter==='update'&&x.state==='update'||filter==='attention'&&['pending','conflict','error','same'].includes(x.state))&&x.name.toLowerCase().includes(query.toLowerCase()));return `<div class="tabs"><button class="${filter==='all'?'active':''}" data-action="filter" data-value="all">全部 ${scoped().length}</button><button class="${filter==='update'?'active':''}" data-action="filter" data-value="update">可更新 ${upgrades().length}</button><button class="${filter==='attention'?'active':''}" data-action="filter" data-value="attention">待处理 ${pending().length}</button><input aria-label="搜索扩展" placeholder="搜索扩展…" value="${esc(query)}" id="search"></div><div id="rows">${list.length?list.map(row).join(''):'<div class="empty"><h3>这里没有需要处理的扩展</h3><p>可以切换到“全部”查看其他扩展。</p></div>'}</div>`}
function summaryPanel(){return upgrades().length?`<div class="summary"><div><h3>${upgrades().length} 个扩展有新版本</h3><p>更新后会提醒你在浏览器重载；其他扩展保持可用。</p></div><button class="primary" data-action="bulk">查看并更新</button></div>`:`<div class="summary"><div><h3>${pending().length?'还有 '+pending().length+' 项需要你完成':'所有扩展都已就绪'}</h3><p>${pending().length?'按下方提示完成加载或处理更新问题。':'需要时点击检查更新，CEPM 不会在后台更改扩展。'}</p></div></div>`}
function variantA(){return `<div class="shell"><aside class="sidebar">${brand()}<div class="eyebrow" style="padding:0 12px 12px">工作空间</div><button class="nav ${view==='library'?'active':''}" data-action="nav" data-value="library">▦ 我的扩展 <b>${scoped().length}</b></button><button class="nav ${view==='attention'?'active':''}" data-action="nav" data-value="attention">◷ 待处理 <b>${pending().length}</b></button><button class="nav ${view==='history'?'active':''}" data-action="nav" data-value="history">↶ 操作记录</button><div class="sidebottom">文件保存在这台电脑<br>退出 CEPM 后扩展仍可使用</div></aside><main class="main"><div class="flex between"><div><div class="eyebrow">你的浏览器工具箱</div><h1>${view==='history'?'操作记录':view==='attention'?'待处理':'我的扩展'}</h1><p class="subtitle">${view==='attention'?'这些操作需要你完成，CEPM 会保留当前文件。':target().browser+' · '+target().name+' 的安装、版本与待办独立管理。'}</p></div>${controls()}</div>${view==='history'?historyView():!scoped().length?empty():`${summaryPanel()}${collection()}<div class="footnote">◷ ${checkedAt} · 浏览器中的版本由你核对确认</div>`}</main></div>`}
function variantB(){return `<main class="tasklayout"><div class="topnav">${brand()}${controls()}</div><div class="taskhero"><div><div class="eyebrow">你的扩展，井然有序</div><h1>${pending().length?'先完成这 '+pending().length+' 件事':'一切就绪'}</h1><p class="subtitle">${scoped().length} 个扩展 · ${upgrades().length} 个可更新 · ${checkedAt}</p></div><button class="quiet" data-action="history">操作记录 ↗</button></div>${!scoped().length?empty():`<div class="taskgrid"><section class="card"><h3>需要你的操作</h3>${pending().length?pending().map(x=>`<div class="task"><div class="flex">${icon(x)}<div><h3>${x.name}</h3><span class="source">${x.browser} / ${x.profile}</span></div></div><p>${x.state==='same'?'版本号未变，但来源文件有变化，需要你决定是否重新部署。':x.state==='pending'?x.first?'文件已准备好。现在到浏览器完成首次加载。':'新版已准备好。重载并核对后，就能确认更新完成。':x.state==='conflict'?'安装文件有手动修改，更新已暂停。你的改动仍保留。':'这次没有获取到新版本，已安装的扩展不受影响。'}</p>${action(x)}</div>`).join(''):'<p class="subtitle" style="margin-top:20px">暂无待办，可以继续使用浏览器。</p>'}</section><section class="card"><div class="flex between"><h3>可用更新</h3><span class="badge update">${upgrades().length}</span></div>${upgrades().map(x=>`<div class="task"><div class="flex">${icon(x)}<h3>${x.name}</h3></div><p>${x.version} → ${x.latest}<br>${x.source}</p>${action(x)}</div>`).join('')||'<p class="subtitle" style="margin-top:20px">当前没有可用更新。</p>'}${upgrades().length?'<div class="rule"></div><button data-action="bulk" style="width:100%">查看全部更新</button>':''}</section></div><div style="margin-top:35px" class="flex between"><h2>所有扩展</h2><span class="muted" style="font-size:12px">${scoped().length} 项</span></div>${scoped().map(row).join('')}`}</main>`}
function variantC(){const x=scoped().find(x=>x.id===selected)||scoped()[0];return `<div class="compact"><aside class="compactaside">${brand()}<div class="flex" style="padding:0 8px 17px"><button class="primary small" data-action="add">＋ 添加扩展</button><button class="small" data-action="check">检查更新</button></div>${upgrades().length?'<button class="small" style="margin:0 8px 18px" data-action="bulk">查看全部更新 · '+upgrades().length+'</button>':''}<div class="eyebrow" style="padding:8px">我的扩展 · ${scoped().length}</div>${scoped().map(y=>`<button class="compactrow ${y===x?'active':''}" data-action="select" data-id="${y.id}">${icon(y)}<span><strong style="font-size:12px">${y.name}</strong><br><span style="font-size:11px;color:${y.state==='ok'?'#7b838a':'#94631c'}">${status[y.state]} · ${y.version}</span></span></button>`).join('')}<button class="quiet small" style="margin-top:22px" data-action="history">↶ 操作记录</button></aside><main class="compactdetail">${x?detail(x):empty()}</main></div>`}
function historyView(){return `<div style="margin-top:25px">${logs.filter(l=>l.targetId===targetId).map(l=>l.text).concat(scoped().flatMap(x=>x.history.map(t=>x.name+' · '+t))).map((t,i)=>`<div class="history">${esc(t)}<small>${i===0?'最近一次操作':'本次体验'} · 仅保存在原型内存中</small></div>`).join('')||'<div class="empty">还没有操作记录</div>'}</div>`}
function detail(x){return `<div class="detailhero">${icon(x)}<div><h2>${x.name}</h2><p class="subtitle">${x.desc}</p><span class="targetbadge">${x.browser} · ${esc(x.profile)}</span></div></div>${badge(x)}<div class="statuspanel ${x.state}"><h3>${x.state==='same'?'同一版本的文件有变化':x.state==='update'?'新版本 '+x.latest+' 已可用':x.state==='pending'?x.first?'再完成一次浏览器加载':x.restored?'旧文件已恢复，还需要重载':'新版文件已准备好，还需要重载':x.state==='conflict'?'你的手动修改已保留':x.state==='error'?'这次未能获取更新':'可以继续使用'}</h3><p>${x.state==='same'?'来源的版本号没有变化，但内容不同。只有你明确选择重新部署才会替换文件。':x.state==='update'?'CEPM 会保留一份旧文件，再准备新版。浏览器重载后由你核对版本。':x.state==='pending'?'CEPM 尚未确认浏览器已使用这些文件。按引导操作后，再标记为用户已确认。':x.state==='conflict'?'检测到固定安装目录中的 styles.css 被改动。为避免覆盖，CEPM 已暂停更新。请先将改动另存，再恢复安装目录后重新检查。':x.state==='error'?'GitHub 来源暂时不可访问。请检查网络与 gh 的仓库访问权限后重试；当前安装仍然可用。':'已由你在目标浏览器核对。退出 CEPM 不影响扩展使用。'}</p>${['pending','update','same'].includes(x.state)?action(x):''}${x.state==='conflict'?'<button class="small quiet" data-action="show-folder">查看安装文件夹 ↗</button>':''}${x.state==='error'?'<button class="small" data-action="retry" data-id="'+x.id+'">重新检查</button>':''}</div><div class="kv"><span>浏览器</span><span>${x.browser} · ${esc(x.profile)}</span><span>磁盘安装版本</span><span>${x.version}</span><span>${x.state==='pending'?'上次确认的生效版本':'生效版本'}</span><span>${x.effective||'尚未确认'}${x.state==='pending'&&x.effective?'（历史，当前待核对）':''}</span><span>来源</span><span>${esc(x.source)}</span></div><div class="rule"></div><div class="flex"><button data-action="versions" data-id="${x.id}">选择其他版本</button>${x.backup?`<button class="quiet" data-action="restore" data-id="${x.id}">报告加载失败 / 恢复旧版</button>`:''}</div><details><summary>安装位置与技术信息</summary><div class="kv"><span>目标配置位置</span><span class="targetpath">${targetFor(x).dataRoot}/${targetFor(x).directory}</span><span>固定安装目录</span><span>~/Library/Application Support/CEPM/installations/${x.id}/</span><span>扩展 ID</span><span>${x.extensionId||'首次加载后核对'}</span><span>来源定位</span><span>${x.type==='repo'?'main · 提交 9c7a2d1（示例）':x.type==='release'?'Release '+(x.tag||'v0.8.0')+' · 扩展版本独立于仓库标签':'manifest.json 声明版本'}</span></div></details>`}
function render(){ $('#app').innerHTML=topbar()+targetStrip()+(target().missing?missingTarget():({A:variantA,B:variantB,C:variantC}[variant]()));switcher(); }
function switcher(){ $('#switcher').innerHTML=`<div class="prototypebar"><small>交互原型 · 模拟数据</small><div class="sep"></div><button data-action="prev" aria-label="上一布局">←</button><span class="label">${variant} · ${names[variant]}</span><button data-action="next" aria-label="下一布局">→</button><div class="sep"></div><select id="scene" aria-label="体验场景"><option value="daily" ${scene==='daily'?'selected':''}>日常管理</option><option value="empty" ${scene==='empty'?'selected':''}>首次使用</option><option value="mixed" ${scene==='mixed'?'selected':''}>批量部分失败</option><option value="missing" ${scene==='missing'?'selected':''}>目标配置找不到</option><option value="same" ${scene==='same'?'selected':''}>同版本内容变化</option></select><button data-action="reset">重置</button></div>`; }
function toast(t){$('#toast').innerHTML=`<div class="toast">${esc(t)}</div>`;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').innerHTML='',3800)}
function openModal(type,id,extra={}){modal={type,id,...extra};drawModal()}
function closeModal(){modal=null;$('#layer').innerHTML=''}
function frame(title,body,footer,sub='',wide=false){$('#layer').innerHTML=`<div class="overlay"><section role="dialog" aria-modal="true" aria-label="${title}" class="modal ${wide?'wide':''}"><div class="modalhead"><div class="flex between"><h2>${title}</h2><button class="quiet" data-action="close" aria-label="关闭">✕</button></div>${sub?`<p class="subtitle">${sub}</p>`:''}</div><div class="modalbody">${body}</div>${footer?`<div class="modalfoot">${footer}</div>`:''}</section></div>`}
function drawModal(){if(!modal)return;let x=byId(modal.id);switch(modal.type){
case 'add':drawAdd();break;
case 'locate':frame('定位 '+target().browser+' · '+target().name,`<p class="muted">在要维护的浏览器配置中打开 ${target().browser==='Chrome'?'chrome':'edge'}://version，复制 Profile Path。</p><label class="field" style="margin-top:20px">Profile Path<input id="locate-path" placeholder="完整配置目录"></label><label class="check"><input type="checkbox" id="locate-checked">我已核对，这是原来绑定的同一个配置。</label><div class="notice">这里只演示定位流程，不读取真实路径。正式应用无法确认原配置身份时，会要求重新绑定与核对，不能沿用旧的生效确认。</div><div id="modal-error"></div>`,`<button class="quiet" data-action="close">取消</button><button class="primary" data-action="target-locate-confirm">检查并定位</button>`);break;
case 'detail':frame('扩展详情',detail(x),'<span></span><button data-action="close">完成</button>','',true);break;
case 'history':frame('操作记录',historyView(),'<span></span><button data-action="close">完成</button>');break;
case 'versions':{if(x.type!=='release'){frame(x.type==='local'?'从另一个文件夹选择版本':'选择其他仓库引用',`<div class="selection">${icon(x)}<div><h3>${x.name}</h3><span class="source">已安装 ${x.version}</span></div></div><label class="field" style="margin-top:20px">${x.type==='local'?'包含旧版或新版产物的文件夹':'分支 / 标签 / 提交'}<input id="alternate-source" placeholder="${x.type==='local'?'例如 ~/Downloads/my-extension-1.0':'例如 v1.0.0 或提交编号'}"></label><div class="notice">原型将演示读取版本 1.0.0。正式应用会从所选产物的清单读取版本，不提供来源中不存在的历史文件。</div><div id="modal-error"></div>`,`<button class="quiet" data-action="close">取消</button><button class="primary" data-action="alternate-preview" data-id="${x.id}">读取并预览 →</button>`);break;}const options=[...new Set([x.latest,x.version,'1.0.0'])];frame('选择扩展版本',`<div class="selection">${icon(x)}<div><h3>${x.name}</h3><div class="source">已安装 ${x.version} · ${esc(x.source)}</div></div></div><p class="subtitle" style="margin:19px 0 6px">${x.type==='local'?'本地历史版本需要你提供对应的文件夹。':'选择来源中可获取的版本，继续前会再次预览。'}</p>${options.map((v,i)=>`<div class="versionrow"><label><input type="radio" name="version" value="${v}" ${i===0?'checked':''}> ${v} ${v===x.version?'<span class="pill">已安装</span>':i===0?'<span class="pill">最新正式版</span>':''}<small>${i===options.length-1?'历史版本 · 降级需要你明确确认':'可获取的完整扩展产物'}</small></label></div>`).join('')}<div class="versionrow"><label><input type="radio" name="version" value="1.4.0"> 1.4.0 <span class="pill">预发布</span><small>可主动选择，不会自动加入常规更新</small></label></div>`, `<button class="quiet" data-action="close">取消</button><button class="primary" data-action="version-preview" data-id="${x.id}">预览此版本 →</button>`);break;}
case 'update':{let target=modal.target||x.latest;let same=target===x.version;let down=target.localeCompare(x.version,undefined,{numeric:true})<0;modal.target=target;frame(same?'重新部署相同版本':down?'确认降级':'准备更新',`<div class="selection">${icon(x)}<div><h3>${x.name}</h3><span class="source">${x.version} → ${target}${same?' · 内容已变化':''}</span></div></div><div style="margin:24px 0" class="kv"><span>来源</span><span>${esc(x.source)}</span><span>浏览器</span><span>${x.browser} · ${x.profile}</span><span>安装位置</span><span>保持原目录和扩展身份</span><span>更新后</span><span>需要在浏览器重载并核对版本</span></div><div class="notice ${down||same?'warn':''}">${down?'这是降级操作。旧版扩展可能无法读取新版产生的数据；文件恢复不能撤销扩展的数据迁移。':same?'版本号没有变化，但来源中的文件已改变。只有你明确选择后才会替换。':'先校验完整产物，再备份旧文件。获取失败时保留当前版本。'}</div>${down||same?`<label class="check"><input type="checkbox" id="explicit">${same?'我明确要重新部署这些变化':'我理解数据兼容性风险，仍要降级'}</label>`:''}<div id="modal-error"></div>`,`<button class="quiet" data-action="close">取消</button><button class="primary" data-action="deploy" data-id="${x.id}">${same?'重新部署':down?'降级到 '+target:'更新到 '+target}</button>`);break;}
case 'guide':frame(x.first?'完成首次加载':x.restored?'重载并核对恢复的版本':'让新版本在浏览器生效',`<div class="selection">${icon(x)}<div><h3>${x.name}</h3><div class="source">文件 ${x.version} 已准备 · 浏览器尚待核对</div></div></div><div class="notice warn" style="margin:17px 0 23px">请在 <strong>${x.browser} · ${x.profile}</strong> 中操作，避免加载到其他配置。</div><div class="guide"><span class="num">1</span><div><h3>打开浏览器的扩展管理页</h3><p>在目标配置的地址栏输入 ${x.browser==='Chrome'?'chrome':'edge'}://extensions</p><button class="small" style="margin-top:9px" data-action="copy-browser" data-id="${x.id}">复制管理页地址</button></div></div><div class="guide"><span class="num">2</span><div><h3>${x.first?'开启开发者模式，加载已解压的扩展':'找到这个扩展，点击“重新加载”'}</h3><p>${x.first?'点击“加载已解压的扩展程序”，选择下方固定目录。以后更新仍使用它。':'重载前保存正在进行的工作。CEPM 不会替你关闭或重启浏览器。'}</p>${x.first?`<div class="path">…/CEPM/installations/${x.id}/ <button class="small" data-action="copy-path" data-id="${x.id}">复制目录</button></div>`:''}</div></div><div class="guide"><span class="num">3</span><div style="flex:1"><h3>核对浏览器中显示的版本</h3><p>应显示 <strong>${x.version}</strong>。核对后会记录为“用户已确认”。</p></div></div><div class="flex"><label class="field" style="flex:1">浏览器中实际显示的版本<input id="confirm-version" placeholder="例如 ${x.version}"></label>${x.first?'<label class="field" style="flex:1">扩展 ID<input id="confirm-id" placeholder="从扩展卡片复制 32 位 ID"></label>':''}</div><label class="check"><input type="checkbox" id="confirmed">我已在 ${x.browser} · ${x.profile} 完成上述操作并核对。</label><div id="modal-error"></div>`,`<button class="quiet" data-action="close">稍后完成</button><button class="primary" data-action="confirm" data-id="${x.id}">确认已生效</button>`,'可以随时离开，未完成的项目会保留在“待处理”。',true);break;
case 'restore':frame('恢复之前的扩展文件',`<div class="selection">${icon(x)}<div><h3>${x.name}</h3><div class="source">${x.version} → ${x.backup}</div></div></div><p style="margin:20px 0">如果新版在浏览器中明确加载失败，可以恢复更新前的文件。恢复后，仍需重载并重新核对。</p><div class="notice warn">仅恢复扩展文件；无法撤销新版已经写入的扩展数据。尚未重载或无法确定状态，不代表加载失败。</div><label class="check"><input type="checkbox" id="failed">我已尝试重载，确认新版无法加载。</label><div id="modal-error"></div>`,`<button class="quiet" data-action="close">继续保留新版</button><button class="danger" data-action="restore-confirm" data-id="${x.id}">恢复 ${x.backup} 文件</button>`);break;
case 'bulk':{let list=upgrades();frame('确认这次更新',`<p class="muted">仅更新 ${target().browser} · ${target().name} 中的扩展。逐项获取与备份，其他配置不受影响。</p>${list.map(x=>`<div class="versionrow">${icon(x)}<div style="flex:1"><h3>${x.name}</h3><small style="margin:0">${x.source}</small></div><span>${x.version} → ${x.latest}</span></div>`).join('')}<div class="notice" style="margin-top:20px">${scoped().filter(x=>x.state==='conflict').length?'已排除有本地改动的扩展。':''}同版本重新部署、降级和附件重选需要单独确认。</div>`,`<button class="quiet" data-action="close">取消</button><button class="primary" data-action="bulk-run">更新 ${list.length} 个扩展</button>`);break;}
case 'bulk-results':frame('文件更新结果',modal.results.map(r=>`<div class="versionrow"><div style="flex:1"><h3>${r.name}</h3><small style="margin:0">${r.error?'获取阶段失败 · 检查网络或 gh 仓库权限后重试；旧版仍可用。':'文件已更新 · 下一步到浏览器重载并核对'}</small></div><span class="badge ${r.error?'error':'pending'}">${r.error?'保留旧版':'等待核对'}</span></div>`).join(''),'<button class="quiet" data-action="close">稍后处理</button><button class="primary" data-action="show-attention">查看待处理</button>');break;
}}
function drawAdd(){let m=modal;m.step=m.step||1;m.sourceType=m.sourceType||'release';let steps=`<div class="steps"><span class="${m.step===1?'on':''}">1 选择来源</span><i></i><span class="${m.step===2?'on':''}">2 确认扩展</span><i></i><span class="${m.step===3?'on':''}">3 确认安装位置</span></div>`;let body='';if(m.step===1){body=`<div class="segmented">${[['release','GitHub Release'],['repo','仓库子目录'],['local','本地文件夹']].map(([k,t])=>`<button class="${m.sourceType===k?'active':''}" data-action="source-type" data-value="${k}">${t}</button>`).join('')}</div>${m.sourceType==='local'?'<label class="field">扩展文件夹<button style="display:block;width:100%;margin-top:8px;text-align:left" data-action="pick-folder">▱ '+(m.folder?'my-extension /':'选择文件夹…')+'</button><small>选择已包含 manifest.json 和所需文件的文件夹，无需构建。</small></label>':`<label class="field">${m.sourceType==='release'?'GitHub 仓库或 Release 地址':'GitHub 仓库地址'}<input id="source-url" placeholder="${m.sourceType==='release'?'https://github.com/jackwener/OpenCLI':'https://github.com/example/extension'}" value="${esc(m.url||'')}"><small>${m.sourceType==='release'?'我们会查找正式发布的扩展安装包。':'只读取可直接加载的产物，不运行仓库中的构建脚本。'}</small></label>${m.sourceType==='repo'?'<div class="flex"><label class="field" style="flex:1">分支 / 标签 / 提交<input id="ref" value="main"></label><label class="field" style="flex:1">扩展子目录<input id="subdir" placeholder="extension"></label></div>':''}<div class="notice">公开和私有仓库均通过这台电脑上的 GitHub CLI 访问，沿用你已有的授权。</div>`}<div id="modal-error"></div>`;}if(m.step===2){body=`<div class="selection"><div class="icon">${m.sourceType==='release'?'O_':'E'}</div><div><h3>${m.sourceType==='release'?'OpenCLI Browser Bridge':'我的扩展'}</h3><span class="source">Manifest V3 · 完整扩展产物</span></div></div><label class="field" style="margin-top:22px">扩展版本<select id="add-version">${m.sourceType==='release'?'<option value="1.3.0">1.3.0 · 最新正式版（推荐）</option><option value="1.2.0">1.2.0 · 历史版本</option><option value="1.4.0">1.4.0 · 预发布，需主动选择</option>':'<option value="1.3.0">1.3.0 · 所选产物声明的版本</option>'}</select><small>${m.sourceType==='release'?'所属 Release：v0.8.0。仓库标签与扩展版本可能不同。':m.sourceType==='repo'?'已解析到具体提交 9c7a2d1（原型示例）':'版本读取自本地 manifest.json；历史版本需提供对应目录。'}</small></label>${m.sourceType==='release'?'<label class="field">安装包<select id="asset"><option>opencli-extension-v1.3.0.zip · 浏览器扩展</option><option>browser-bridge-alternate.zip · 其他候选</option></select><small>已根据名称预选。多个候选时，请确认用途。</small></label>':''}<div class="notice">文件会保存在 CEPM 的固定目录。原始文件夹移动、应用退出，都不会影响已安装扩展。</div>`;}if(m.step===3){body=`<div class="targetcard"><div class="eyebrow" style="margin-bottom:10px">安装到当前配置</div><div class="flex"><span class="avatar">${target().initial}</span><h2>${target().browser} · ${target().name}</h2></div><p class="subtitle">本次只添加到这个配置。其他浏览器和配置不会改变。</p><details><summary>查看绑定的真实位置</summary><p class="targetpath" style="margin-top:10px">${target().app}<br>${target().dataRoot}/${target().directory}</p></details></div><div class="notice"><strong>首次需要你在这个配置中完成一次加载</strong><br>我们会提供固定目录和操作指引。需要安装到别处时，请退出向导，先切换顶部的浏览器与配置。</div><div id="modal-error"></div>`;}frame('添加扩展',steps+body,`<button class="quiet" data-action="${m.step===1?'close':'add-back'}">${m.step===1?'取消':'← 上一步'}</button><button class="primary" data-action="add-next">${m.step===1?'查找扩展 →':m.step===2?'使用此版本 →':'准备安装文件'}</button>`,'添加到 '+target().browser+' · '+target().name);}
function performDeploy(x,target){x.restored=false;x.backup=x.version;x.version=target;x.state='pending';x.first=false;x.history.unshift('文件部署 '+target+'；保留备份 '+x.backup+'，等待用户核对');logEntry(x,x.name+' · 文件已更新至 '+target+'，待核对');}
function simulateProgress(title,after){frame(title,'<p class="muted">正在获取并校验产物，随后备份与部署文件…</p><div class="progressline"></div>','','演示过程约一秒，不会访问真实来源。');setTimeout(after,850)}
function err(t){$('#modal-error').innerHTML=`<p class="inline-error">${t}</p>`}
function setVariant(v){variant=v;const u=new URL(location);u.searchParams.set('variant',v);history.replaceState({},'',u);closeModal();render()}
function resetScene(){items=scene==='empty'?[]:seedTargets();profiles.forEach(p=>p.missing=false);checkedTargets={};targetId='chrome-personal';selected=1;filter='all';view='library';query='';logs=[];checkedAt='还未检查';if(scene==='mixed'){items[1].state='update';items[1].latest='2.2.0';items[1].fail=true;items[1].browser='Chrome';items[1].profile='个人';items[1].targetId='chrome-personal';}if(scene==='missing')target().missing=true;if(scene==='same'){items[0].latest=items[0].version;items[0].state='same';items[0].changed=true;}closeModal();render();if(scene==='same')openModal('update',1,{target:items[0].version});}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id,x=byId(id);switch(a){case 'browser-switch':switchTarget(profiles.find(p=>p.browser===b.dataset.value).id);break;case 'profile-switch':switchTarget(b.dataset.value);break;case 'target-info':targetInfo();break;case 'target-locate':openModal('locate');break;case 'target-locate-confirm':{const value=$('#locate-path').value.trim();if(!value||!$('#locate-checked').checked){err('请填写配置路径，并确认已与目标浏览器的 Profile Path 核对。');break;}target().missing=false;closeModal();render();toast('演示：已重新定位当前配置。正式应用须验证位置与已有绑定是否一致。');break;}case 'add':openModal('add');break;case 'close':closeModal();break;case 'detail':openModal('detail',id);break;case 'guide':openModal('guide',id);break;case 'versions':openModal('versions',id);break;case 'update':openModal('update',id);break;case 'restore':openModal('restore',id);break;case 'history':openModal('history');break;case 'filter':filter=b.dataset.value;render();break;case 'select':selected=Number(id);render();break;case 'nav':view=b.dataset.value;filter=view==='attention'?'attention':'all';render();break;case 'check':busy=true;render();setTimeout(()=>{busy=false;checkedAt='刚刚检查';checkedTargets[targetId]=checkedAt;render();toast('检查完成：'+upgrades().length+' 个可更新，'+pending().length+' 个待处理')},650);break;case 'retry':x.state=x.latest!==x.version?'update':'ok';render();openModal('detail',id);break;case 'bulk':openModal('bulk');break;case 'bulk-run':{const list=upgrades().slice();simulateProgress('正在逐项更新',()=>{let results=list.map(y=>{if(y.fail){y.state='error';logEntry(y,y.name+' · 获取失败，保留 '+y.version);return{name:y.name,error:true}}performDeploy(y,y.latest);return{name:y.name,error:false}});render();openModal('bulk-results',null,{results})});break;}case 'show-attention':closeModal();filter='attention';view='attention';render();break;case 'source-type':modal.sourceType=b.dataset.value;drawModal();break;case 'pick-folder':modal.folder=true;drawModal();toast('已选择演示文件夹；原型不会读取本地文件');break;case 'add-back':modal.step--;drawModal();break;case 'add-next':{let m=modal;if(m.step===1){if(m.sourceType==='local'&&!m.folder){err('请先选择演示文件夹。');break;}if(m.sourceType!=='local'){m.url=$('#source-url').value.trim();if(!m.url){err('请填写 GitHub 来源地址。');break;}if(m.sourceType==='repo'){m.ref=$('#ref').value;m.subdir=$('#subdir').value;if(!m.subdir){err('请填写扩展所在的子目录，例如 extension。');break;}}}m.step=2;drawModal();}else if(m.step===2){m.version=$('#add-version').value;m.step=3;drawModal();}else{let profile=target().name,browser=target().browser;let next={id:Date.now(),name:m.sourceType==='release'?'OpenCLI Browser Bridge':'我的扩展',desc:'新添加的浏览器扩展',symbol:m.sourceType==='release'?'O_':'E',color:'',type:m.sourceType,source:m.sourceType==='local'?'本地目录 · my-extension':m.url+(m.sourceType==='repo'?' · '+m.ref+' / '+m.subdir:''),version:m.version,latest:m.version,effective:null,state:'pending',first:true,browser,profile,targetId,history:['文件已安装，等待首次加载']};simulateProgress('准备安装文件',()=>{items.push(next);selected=next.id;render();openModal('guide',next.id)})}break;}case 'alternate-preview':if(!$('#alternate-source').value.trim()){err('请先填写要读取的来源。');break;}openModal('update',id,{target:'1.0.0'});break;case 'version-preview':openModal('update',id,{target:document.querySelector('input[name="version"]:checked').value});break;case 'deploy':if($('#explicit')&&!$('#explicit').checked){err('请先确认这次操作。');break;}let target=modal.target;simulateProgress('准备 '+target+' 的文件',()=>{performDeploy(x,target);render();openModal('guide',id)});break;case 'confirm':{let v=$('#confirm-version').value.trim();if(!$('#confirmed').checked){err('请先在指定浏览器配置完成操作并勾选确认。');break;}if(v!==x.version){err('浏览器显示的版本与文件 '+x.version+' 不一致，请先重载后再次核对。');break;}if(x.first){let eid=$('#confirm-id').value.trim();if(!/^[a-p]{32}$/.test(eid)){err('请复制 32 位 a–p 小写字母组成的扩展 ID。体验时可输入 32 个 a。');break;}x.extensionId=eid;}x.effective=v;x.state=x.latest!==v?'update':'ok';x.first=false;x.history.unshift('用户确认 '+v+' 已在 '+x.browser+' / '+x.profile+' 生效');logEntry(x,x.name+' · 用户已确认 '+v);closeModal();render();toast(x.name+' 已标记为用户确认');break;}case 'restore-confirm':if(!$('#failed').checked){err('请先确认已经重载且明确加载失败；未知状态会保持待核对。');break;}x.version=x.backup;x.restored=true;x.backup=null;x.state='pending';x.history.unshift('因明确加载失败恢复旧文件，等待重新核对');render();openModal('guide',id);toast('旧文件已恢复，请重载并重新核对');break;case 'copy-browser':navigator.clipboard?.writeText((x.browser==='Chrome'?'chrome':'edge')+'://extensions');toast('已复制扩展管理页地址');break;case 'copy-path':toast('原型演示：正式应用会复制完整安装目录');break;case 'show-folder':toast('原型演示：正式应用会打开该扩展的安装文件夹');break;case 'prev':setVariant(['C','A','B'][['A','B','C'].indexOf(variant)]);break;case 'next':setVariant(['B','C','A'][['A','B','C'].indexOf(variant)]);break;case 'reset':resetScene();break;}});
document.addEventListener('change',e=>{if(e.target.id==='add-version'&&$('#asset')){$('#asset').options[0].text='opencli-extension-v'+e.target.value+'.zip · 浏览器扩展';}if(e.target.id==='scene'){scene=e.target.value;resetScene()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){let caret=e.target.selectionStart;query=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(caret,caret)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();return;}if(modal||e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();let i=['A','B','C'].indexOf(variant);setVariant(['A','B','C'][(i+(e.key==='ArrowRight'?1:2))%3])}});
render();
</script>
</body></html>
